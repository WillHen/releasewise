name: dependabot-bun-lock

# Dependabot bumps package.json but does not understand Bun's lockfile, so its
# PRs leave bun.lock stale and `bun install --frozen-lockfile` in ci.yml fails
# before any checks run (see #30). This workflow regenerates bun.lock on
# Dependabot PRs and pushes it back to the PR branch.
#
# The push uses a Personal Access Token (or GitHub App token), NOT the default
# GITHUB_TOKEN: pushes made with GITHUB_TOKEN do not trigger new workflow runs,
# so the ci check would never re-run against the synced lockfile. A PAT push
# re-triggers ci.yml, which then passes with the frozen lockfile.
#
# Setup required:
#   1. Create a token with `contents: write` on this repo (a fine-grained PAT
#      or a GitHub App installation token).
#   2. Add it as a Dependabot secret named DEPENDABOT_LOCKFILE_TOKEN
#      (Settings -> Secrets and variables -> Dependabot). It must be a
#      Dependabot secret, not an Actions secret, because this workflow is
#      triggered by Dependabot.

on:
  pull_request:
    # Only dependency bumps touch package.json / bun.lock; skip the rest
    # (e.g. github-actions bumps) so we don't spin up a runner needlessly.
    paths:
      - package.json
      - bun.lock

# The push uses the PAT, so the job's own GITHUB_TOKEN needs no write access.
permissions:
  contents: read

jobs:
  sync-lockfile:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.DEPENDABOT_LOCKFILE_TOKEN }}

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          # Keep in sync with the bun-version pinned in ci.yml, otherwise the
          # two can resolve slightly different lockfiles.
          bun-version: 1.3.12

      # --ignore-scripts: don't run package postinstall scripts here; we only
      # need to resolve dependencies and update the lockfile.
      - name: Regenerate lockfile
        run: bun install --ignore-scripts

      - name: Commit and push if the lockfile changed
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already in sync; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "build(deps): sync bun.lock to match package.json"
          git push origin "HEAD:${{ github.head_ref }}"
